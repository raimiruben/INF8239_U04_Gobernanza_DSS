priority_harm: "Un caso de riesgo real que el sistema deja al final de la cola (falso negativo) y que recibe revisión humana tardía. Se prioriza sobre la revisión innecesaria (falso positivo), cuyo costo es menor porque la persona revisora puede descartarla, aunque esa carga recae sobre todo en G2."
primary_metric: "Recall (sensibilidad) global y por grupo, con la brecha de recall entre G1 y G2 como métrica de equidad. La tasa de falsos positivos y su brecha se vigilan como métrica secundaria."
tolerance: "Umbrales de configs/governance.yml: recall mínimo de 0,68, brecha máxima de recall de 0,16 y brecha máxima de falsos positivos de 0,16. Como criterio adicional propuesto, el recall de cada grupo no debe bajar de 0,68 antes de usar el sistema; hoy no se cumple en G1 (0,653)."
evidence: "Auditoría de LAB12 sobre 160 casos de prueba con corte temporal (entrenamiento hasta el 2026-09-24). El modelo logistic cumple ambas brechas (recall 0,138 y falsos positivos 0,125) y el modelo tree las supera (0,181 y 0,168). El recall global es 0,717 en los dos; logistic tiene mayor exactitud (0,719 frente a 0,706) y menor costo (0,24 s y 3,6 KB frente a 0,43 s y 7,9 KB). Frente a una revisión aleatoria con el mismo volumen de selección (recall esperado de 0,53), el modelo alcanza 0,72. Archivos en reports/lab12/logistic/ y reports/lab12/tree/, e interpretación en reports/lab12/INTERPRETATION.md."
limitation: "El soporte es pequeño: 101 casos en G1 y 59 en G2 (en G2 solo 16 negativos), así que las brechas son inestables, y la diferencia entre los dos modelos equivale a cuatro casos individuales. En las intersecciones de protected_group y age_band ninguna celda llega a 30 positivos ni a 30 negativos, por lo que se leen solo como exploratorias y no se usan para decidir. El recall de G1 (0,653) está por debajo del mínimo de 0,68. La variable age_band entra al modelo aunque la política la declara sensible, y zone podría actuar como variable proxy. Los datos son sintéticos. Una brecha observada exige investigación (datos, umbral y consecuencias) y no prueba por sí sola discriminación causal."
recommendation: "REVIEW. Preferir el modelo logistic como opción suficiente, solo para priorizar la cola de revisión humana y sin decisiones automáticas. No pasar a uso real hasta investigar la brecha de recall de G1 (sobre todo entre 30 y 59 años), obtener más datos o intervalos de confianza, decidir y justificar el uso de age_band, y confirmar las puertas en LAB13."
